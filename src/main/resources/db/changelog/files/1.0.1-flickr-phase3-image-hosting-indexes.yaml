databaseChangeLog:
  - changeSet:
      id: 1.0.1-flickr-phase3-item-inventory-photo-sync-index
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                schemaName: ${environment-schema}
                tableName: item_inventory_photo
                indexName: idx_item_inventory_photo_status_inventory
      changes:
        - createIndex:
            schemaName: ${environment-schema}
            tableName: item_inventory_photo
            indexName: idx_item_inventory_photo_status_inventory
            columns:
              - column:
                  name: status
              - column:
                  name: item_inventory_id

  - changeSet:
      id: 1.0.1-flickr-phase3-external-image-sync-index
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                schemaName: ${environment-schema}
                tableName: external_image
                indexName: idx_external_image_service_photo_status_metadata
      changes:
        - createIndex:
            schemaName: ${environment-schema}
            tableName: external_image
            indexName: idx_external_image_service_photo_status_metadata
            columns:
              - column:
                  name: external_service_id
              - column:
                  name: item_inventory_photo_id
              - column:
                  name: sync_status
              - column:
                  name: metadata_hash_at_sync

  - changeSet:
      id: 1.0.1-flickr-phase3-external-image-album-sync-index
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                schemaName: ${environment-schema}
                tableName: external_image_album
                indexName: idx_external_image_album_service_inventory_status
      changes:
        - createIndex:
            schemaName: ${environment-schema}
            tableName: external_image_album
            indexName: idx_external_image_album_service_inventory_status
            columns:
              - column:
                  name: external_service_id
              - column:
                  name: item_inventory_id
              - column:
                  name: sync_status
