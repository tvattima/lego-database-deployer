databaseChangeLog:
  - changeSet:
      id: 1.0.2-bricklink-set-color-not-applicable
      author: codex
      comment: Backfill BrickLink SET marketplace drafts with the required Not Applicable color id.
      preConditions:
        - onFail: HALT
        - tableExists:
            tableName: bricklink_marketplace_listing
        - tableExists:
            tableName: marketplace_listing
        - tableExists:
            tableName: external_catalog_item
        - columnExists:
            tableName: bricklink_marketplace_listing
            columnName: color_id
      changes:
        - sql:
            dbms: mysql
            sql: |
              UPDATE `${environment-schema}`.`bricklink_marketplace_listing` bl
              JOIN `${environment-schema}`.`marketplace_listing` ml
                ON ml.`marketplace_listing_id` = bl.`marketplace_listing_id`
              JOIN `${environment-schema}`.`external_catalog_item` eci
                ON eci.`external_catalog_item_id` = ml.`external_catalog_item_id`
              SET bl.`color_id` = 0
              WHERE bl.`color_id` IS NULL
                AND UPPER(eci.`item_type_code`) IN ('S', 'SET');
