databaseChangeLog:
  - changeSet:
      id: 1.0.0-gen-2-db-initialization
      author: tvattima
      changes:
        - sql:
            dbms: 'mysql'
            sql: |
              -- MySQL Workbench Forward Engineering
              
              SET @OLD_UNIQUE_CHECKS=@@UNIQUE_CHECKS, UNIQUE_CHECKS=0;
              SET @OLD_FOREIGN_KEY_CHECKS=@@FOREIGN_KEY_CHECKS, FOREIGN_KEY_CHECKS=0;
              SET @OLD_SQL_MODE=@@SQL_MODE, SQL_MODE='NO_AUTO_VALUE_ON_ZERO,ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION';
              
              -- -----------------------------------------------------
              -- Schema ${environment-schema}
              -- -----------------------------------------------------
              
              -- -----------------------------------------------------
              -- Schema ${environment-schema}
              -- -----------------------------------------------------
              CREATE SCHEMA IF NOT EXISTS `${environment-schema}` DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci ;
              USE `${environment-schema}` ;
              
              -- -----------------------------------------------------
              -- Table `${environment-schema}`.`bricklink_inventory`
              -- -----------------------------------------------------
              DROP TABLE IF EXISTS `${environment-schema}`.`bricklink_inventory` ;
              
              CREATE TABLE IF NOT EXISTS `${environment-schema}`.`bricklink_inventory` (
              `bl_inventory_id` INT NOT NULL AUTO_INCREMENT,
              `uuid` CHAR(32) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `bl_item_number` VARCHAR(10) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `inventory_id` INT NULL DEFAULT NULL,
              `item_type` VARCHAR(20) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `color_id` SMALLINT NULL DEFAULT NULL,
              `color_name` VARCHAR(50) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `quantity` SMALLINT NOT NULL,
              `new_or_used` VARCHAR(1) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `completeness` VARCHAR(1) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `unit_price` DECIMAL(7,2) NOT NULL,
              `bind_id` INT NULL DEFAULT NULL,
              `description` VARCHAR(1024) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `remarks` VARCHAR(1024) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `bulk` SMALLINT NULL DEFAULT NULL,
              `is_retain` TINYINT(1) NOT NULL,
              `is_stock_room` TINYINT(1) NOT NULL,
              `stock_room_id` VARCHAR(1) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `date_created` DATETIME NULL DEFAULT NULL,
              `my_cost` DECIMAL(7,2) NULL DEFAULT NULL,
              `sale_rate` TINYINT NULL DEFAULT NULL,
              `tier_quantity1` SMALLINT NULL DEFAULT NULL,
              `tier_quantity2` SMALLINT NULL DEFAULT NULL,
              `tier_quantity3` SMALLINT NULL DEFAULT NULL,
              `tier_price1` DECIMAL(7,2) NULL DEFAULT NULL,
              `tier_price2` DECIMAL(7,2) NULL DEFAULT NULL,
              `tier_price3` DECIMAL(7,2) NULL DEFAULT NULL,
              `my_weight` DECIMAL(5,2) NULL DEFAULT NULL,
              `sealed` TINYINT(1) NOT NULL,
              `order_id` VARCHAR(11) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `fixed_price` TINYINT(1) NULL DEFAULT NULL,
              `for_sale` TINYINT(1) NULL DEFAULT NULL,
              `built_once` TINYINT(1) NULL DEFAULT NULL,
              `box_condition_id` INT NULL DEFAULT NULL,
              `instructions_condition_id` INT NULL DEFAULT NULL,
              `internal_comments` VARCHAR(1024) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `update_timestamp` DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
              `last_synchronized_timestamp` DATETIME NULL DEFAULT NULL,
              `extended_description` VARCHAR(1024) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `extra_description` VARCHAR(1024) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              PRIMARY KEY (`bl_inventory_id`),
              UNIQUE INDEX `uuid` (`uuid` ASC) VISIBLE,
              INDEX `bl_item_index_1` (`bl_item_number` ASC) VISIBLE,
              INDEX `box_condition_id_fk_1` (`box_condition_id` ASC) VISIBLE,
              INDEX `instructions_condition_id_fk_1` (`instructions_condition_id` ASC) VISIBLE)
              ENGINE = InnoDB
              AUTO_INCREMENT = 936;
              
              
              -- -----------------------------------------------------
              -- Table `${environment-schema}`.`external_service_type`
              -- -----------------------------------------------------
              DROP TABLE IF EXISTS `${environment-schema}`.`external_service_type` ;
              
              CREATE TABLE IF NOT EXISTS `${environment-schema}`.`external_service_type` (
              `external_service_type_id` INT NOT NULL,
              `external_service_type_name` VARCHAR(20) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `external_service_type_description` VARCHAR(100) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              PRIMARY KEY (`external_service_type_id`))
              ENGINE = InnoDB;
              
              
              -- -----------------------------------------------------
              -- Table `${environment-schema}`.`external_service`
              -- -----------------------------------------------------
              DROP TABLE IF EXISTS `${environment-schema}`.`external_service` ;
              
              CREATE TABLE IF NOT EXISTS `${environment-schema}`.`external_service` (
              `external_service_id` INT NOT NULL,
              `external_service_name` VARCHAR(50) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `external_service_url` VARCHAR(500) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `external_service_type_id` INT NOT NULL,
              PRIMARY KEY (`external_service_id`),
              UNIQUE INDEX `external_service_name_UNIQUE` (`external_service_name` ASC) VISIBLE,
              INDEX `fk_external_service_external_service_type1_idx` (`external_service_type_id` ASC) VISIBLE,
              CONSTRAINT `fk_external_service_external_service_type1`
              FOREIGN KEY (`external_service_type_id`)
              REFERENCES `${environment-schema}`.`external_service_type` (`external_service_type_id`)
              ON DELETE NO ACTION
              ON UPDATE NO ACTION)
              ENGINE = InnoDB;
              
              
              -- -----------------------------------------------------
              -- Table `${environment-schema}`.`category`
              -- -----------------------------------------------------
              DROP TABLE IF EXISTS `${environment-schema}`.`category` ;
              
              CREATE TABLE IF NOT EXISTS `${environment-schema}`.`category` (
              `external_service_id` INT NOT NULL,
              `external_category_id` INT NOT NULL,
              `category_name` VARCHAR(50) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `parent_id` INT NULL,
              PRIMARY KEY (`external_service_id`, `external_category_id`),
              INDEX `fk_category_external_service1_idx` (`external_service_id` ASC) VISIBLE,
              CONSTRAINT `fk_category_external_service1`
              FOREIGN KEY (`external_service_id`)
              REFERENCES `${environment-schema}`.`external_service` (`external_service_id`)
              ON DELETE NO ACTION
              ON UPDATE NO ACTION)
              ENGINE = InnoDB;
              
              
              -- -----------------------------------------------------
              -- Table `${environment-schema}`.`external_item`
              -- -----------------------------------------------------
              DROP TABLE IF EXISTS `${environment-schema}`.`external_item` ;
              
              CREATE TABLE IF NOT EXISTS `${environment-schema}`.`external_item` (
              `external_item_id` INT NOT NULL AUTO_INCREMENT,
              `external_service_id` INT NOT NULL,
              `external_category_id` INT NOT NULL,
              `external_number` VARCHAR(25) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `external_unique_id` INT NULL,
              `external_name` VARCHAR(250) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `external_item_type` VARCHAR(20) NOT NULL,
              `external_url` VARCHAR(300) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `external_year_released` INT NULL,
              PRIMARY KEY (`external_item_id`),
              INDEX `fk_external_item_category1_idx` (`external_service_id` ASC, `external_category_id` ASC) VISIBLE,
              CONSTRAINT `fk_external_item_category1`
              FOREIGN KEY (`external_service_id` , `external_category_id`)
              REFERENCES `${environment-schema}`.`category` (`external_service_id` , `external_category_id`)
              ON DELETE NO ACTION
              ON UPDATE NO ACTION)
              ENGINE = InnoDB;
              
              
              -- -----------------------------------------------------
              -- Table `${environment-schema}`.`bricklink_sale_item`
              -- -----------------------------------------------------
              DROP TABLE IF EXISTS `${environment-schema}`.`bricklink_sale_item` ;
              
              CREATE TABLE IF NOT EXISTS `${environment-schema}`.`bricklink_sale_item` (
              `bl_sale_item_id` INT NOT NULL AUTO_INCREMENT,
              `inventory_id` INT NOT NULL,
              `description` VARCHAR(2048) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `new_or_used` VARCHAR(1) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `completeness` VARCHAR(1) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `quantity` SMALLINT NOT NULL,
              `has_extended_description` TINYINT(1) NOT NULL,
              `unit_price` DECIMAL(7,2) NOT NULL,
              `country_code` VARCHAR(2) COLLATE 'utf8mb3_unicode_ci' NOT NULL DEFAULT 'ZZ',
              `date_created` DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
              `status` VARCHAR(1) COLLATE 'utf8mb3_unicode_ci' NOT NULL DEFAULT 'C',
              `external_item_id` INT NOT NULL,
              PRIMARY KEY (`bl_sale_item_id`),
              UNIQUE INDEX `inventory_id` (`inventory_id` ASC) VISIBLE,
              INDEX `fk_bricklink_sale_item_external_item1_idx` (`external_item_id` ASC) VISIBLE,
              CONSTRAINT `fk_bricklink_sale_item_external_item1`
              FOREIGN KEY (`external_item_id`)
              REFERENCES `${environment-schema}`.`external_item` (`external_item_id`)
              ON DELETE NO ACTION
              ON UPDATE NO ACTION)
              ENGINE = InnoDB
              AUTO_INCREMENT = 58644;
              
              
              -- -----------------------------------------------------
              -- Table `${environment-schema}`.`carrier`
              -- -----------------------------------------------------
              DROP TABLE IF EXISTS `${environment-schema}`.`carrier` ;
              
              CREATE TABLE IF NOT EXISTS `${environment-schema}`.`carrier` (
              `carrier_code` VARCHAR(10) NOT NULL,
              `carrier_name` VARCHAR(100) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `tracking_url_pattern` VARCHAR(300) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              PRIMARY KEY (`carrier_code`))
              ENGINE = InnoDB;
              
              
              -- -----------------------------------------------------
              -- Table `${environment-schema}`.`condition`
              -- -----------------------------------------------------
              DROP TABLE IF EXISTS `${environment-schema}`.`condition` ;
              
              CREATE TABLE IF NOT EXISTS `${environment-schema}`.`condition` (
              `condition_id` INT NOT NULL,
              `condition_code` VARCHAR(5) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `condition_description` VARCHAR(50) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `condition_text` TINYTEXT COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              PRIMARY KEY (`condition_id`))
              ENGINE = InnoDB;
              
              
              -- -----------------------------------------------------
              -- Table `${environment-schema}`.`cost_type`
              -- -----------------------------------------------------
              DROP TABLE IF EXISTS `${environment-schema}`.`cost_type` ;
              
              CREATE TABLE IF NOT EXISTS `${environment-schema}`.`cost_type` (
              `cost_type_code` VARCHAR(10) NOT NULL,
              `cost_type_name` VARCHAR(45) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `cost_type_description` VARCHAR(300) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              PRIMARY KEY (`cost_type_code`))
              ENGINE = InnoDB;
              
              
              -- -----------------------------------------------------
              -- Table `${environment-schema}`.`item_inventory`
              -- -----------------------------------------------------
              DROP TABLE IF EXISTS `${environment-schema}`.`item_inventory` ;
              
              CREATE TABLE IF NOT EXISTS `${environment-schema}`.`item_inventory` (
              `item_inventory_id` INT NOT NULL AUTO_INCREMENT,
              `uuid` CHAR(36) NOT NULL,
              `box_number` INT NULL DEFAULT NULL,
              `description` TEXT COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `active` TINYINT(1) NULL,
              `for_sale` TINYINT(1) NULL,
              `new_or_used` VARCHAR(1) NULL,
              `completeness` VARCHAR(1) COLLATE 'utf8mb3_unicode_ci' NULL,
              `item_condition_id` INT NULL DEFAULT NULL,
              `box_condition_id` INT NULL DEFAULT NULL,
              `instructions_condition_id` INT NULL DEFAULT NULL,
              `sealed` TINYINT(1) NULL,
              `built_once` TINYINT(1) NULL DEFAULT NULL,
              PRIMARY KEY (`item_inventory_id`),
              INDEX `fk_item_inventory_condition1_idx` (`item_condition_id` ASC) VISIBLE,
              INDEX `fk_item_inventory_condition2_idx` (`instructions_condition_id` ASC) VISIBLE,
              UNIQUE INDEX `uuid_UNIQUE` (`uuid` ASC) VISIBLE,
              CONSTRAINT `fk_item_inventory_condition1`
              FOREIGN KEY (`item_condition_id`)
              REFERENCES `${environment-schema}`.`condition` (`condition_id`)
              ON DELETE NO ACTION
              ON UPDATE NO ACTION,
              CONSTRAINT `fk_item_inventory_condition2`
              FOREIGN KEY (`instructions_condition_id`)
              REFERENCES `${environment-schema}`.`condition` (`condition_id`)
              ON DELETE NO ACTION
              ON UPDATE NO ACTION)
              ENGINE = InnoDB;
              
              
              -- -----------------------------------------------------
              -- Table `${environment-schema}`.`inventory_index`
              -- -----------------------------------------------------
              DROP TABLE IF EXISTS `${environment-schema}`.`inventory_index` ;
              
              CREATE TABLE IF NOT EXISTS `${environment-schema}`.`inventory_index` (
              `box_id` INT NOT NULL DEFAULT '0',
              `box_index` INT NOT NULL DEFAULT '0',
              `item_number` VARCHAR(15) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `box_name` VARCHAR(20) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `box_number` VARCHAR(10) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `sealed` VARCHAR(5) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `quantity` INT NULL DEFAULT NULL,
              `description` TEXT COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `active` TINYINT(1) NULL DEFAULT '1',
              `moved_to_box_id` INT NULL DEFAULT NULL,
              PRIMARY KEY (`box_id`, `box_index`),
              INDEX `inventory_index__index_1` (`box_id` ASC, `box_index` ASC) VISIBLE)
              ENGINE = InnoDB;
              
              
              -- -----------------------------------------------------
              -- Table `${environment-schema}`.`party`
              -- -----------------------------------------------------
              DROP TABLE IF EXISTS `${environment-schema}`.`party` ;
              
              CREATE TABLE IF NOT EXISTS `${environment-schema}`.`party` (
              `party_id` INT NOT NULL AUTO_INCREMENT,
              `party_first_name` VARCHAR(50) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `party_middle_initial` CHAR(1) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `party_last_name` VARCHAR(50) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `party_address1` VARCHAR(50) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `party_address2` VARCHAR(50) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `party_city` VARCHAR(50) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `party_state` VARCHAR(50) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `party_postal_code` VARCHAR(50) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `party_country_code` VARCHAR(50) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `party_country` VARCHAR(50) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `party_phone` VARCHAR(50) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `party_email` VARCHAR(50) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `party_type` VARCHAR(50) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `party_activation_date` DATE NULL DEFAULT NULL,
              PRIMARY KEY (`party_id`))
              ENGINE = InnoDB
              AUTO_INCREMENT = 215;
              
              
              -- -----------------------------------------------------
              -- Table `${environment-schema}`.`transaction_platform`
              -- -----------------------------------------------------
              DROP TABLE IF EXISTS `${environment-schema}`.`transaction_platform` ;
              
              CREATE TABLE IF NOT EXISTS `${environment-schema}`.`transaction_platform` (
              `transaction_platform_id` INT NOT NULL,
              `transaction_platform_name` VARCHAR(100) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              PRIMARY KEY (`transaction_platform_id`))
              ENGINE = InnoDB;
              
              
              -- -----------------------------------------------------
              -- Table `${environment-schema}`.`transactions`
              -- -----------------------------------------------------
              DROP TABLE IF EXISTS `${environment-schema}`.`transactions` ;
              
              CREATE TABLE IF NOT EXISTS `${environment-schema}`.`transactions` (
              `transaction_id` INT NOT NULL AUTO_INCREMENT,
              `transaction_date` DATE NULL DEFAULT NULL,
              `notes` TINYTEXT COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `from_party_id` INT NOT NULL,
              `to_party_id` INT NOT NULL,
              `transaction_platform_id` INT NOT NULL,
              `transaction_order_id` VARCHAR(45) NULL,
              PRIMARY KEY (`transaction_id`),
              INDEX `fk_transactions_party1_idx` (`from_party_id` ASC) VISIBLE,
              INDEX `fk_transactions_party2_idx` (`to_party_id` ASC) INVISIBLE,
              INDEX `fk_transactions_transaction_platform1_idx` (`transaction_platform_id` ASC) VISIBLE,
              CONSTRAINT `fk_transactions_party1`
              FOREIGN KEY (`from_party_id`)
              REFERENCES `${environment-schema}`.`party` (`party_id`)
              ON DELETE NO ACTION
              ON UPDATE NO ACTION,
              CONSTRAINT `fk_transactions_party2`
              FOREIGN KEY (`to_party_id`)
              REFERENCES `${environment-schema}`.`party` (`party_id`)
              ON DELETE NO ACTION
              ON UPDATE NO ACTION,
              CONSTRAINT `fk_transactions_transaction_platform1`
              FOREIGN KEY (`transaction_platform_id`)
              REFERENCES `${environment-schema}`.`transaction_platform` (`transaction_platform_id`)
              ON DELETE NO ACTION
              ON UPDATE NO ACTION)
              ENGINE = InnoDB
              AUTO_INCREMENT = 447;
              
              
              -- -----------------------------------------------------
              -- Table `${environment-schema}`.`payment_platform`
              -- -----------------------------------------------------
              DROP TABLE IF EXISTS `${environment-schema}`.`payment_platform` ;
              
              CREATE TABLE IF NOT EXISTS `${environment-schema}`.`payment_platform` (
              `payment_platform_id` INT NOT NULL,
              `payment_platform_name` VARCHAR(50) NOT NULL,
              `payment_platform_url` VARCHAR(500) NULL,
              PRIMARY KEY (`payment_platform_id`))
              ENGINE = InnoDB;
              
              
              -- -----------------------------------------------------
              -- Table `${environment-schema}`.`payment`
              -- -----------------------------------------------------
              DROP TABLE IF EXISTS `${environment-schema}`.`payment` ;
              
              CREATE TABLE IF NOT EXISTS `${environment-schema}`.`payment` (
              `payment_id` INT NOT NULL AUTO_INCREMENT,
              `payment_date` DATE NOT NULL,
              `transaction_id` INT NOT NULL,
              `currency_code` VARCHAR(5) NOT NULL,
              `seller_currency_code` VARCHAR(5) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `exchange_rate` DECIMAL(12,5) NOT NULL,
              `amount` DECIMAL(12,5) NOT NULL,
              `payment_platform_id` INT NOT NULL,
              `payment_platform_transaction_id` VARCHAR(45) NOT NULL COMMENT 'This is the specific payment platform transaction identifier. For example, the PayPal Transaction id',
              PRIMARY KEY (`payment_id`),
              INDEX `fk_payment_transactions1_idx` (`transaction_id` ASC) VISIBLE,
              INDEX `fk_payment_payment_platform1_idx` (`payment_platform_id` ASC) VISIBLE,
              CONSTRAINT `fk_payment_transactions1`
              FOREIGN KEY (`transaction_id`)
              REFERENCES `${environment-schema}`.`transactions` (`transaction_id`)
              ON DELETE NO ACTION
              ON UPDATE NO ACTION,
              CONSTRAINT `fk_payment_payment_platform1`
              FOREIGN KEY (`payment_platform_id`)
              REFERENCES `${environment-schema}`.`payment_platform` (`payment_platform_id`)
              ON DELETE NO ACTION
              ON UPDATE NO ACTION)
              ENGINE = InnoDB;
              
              
              -- -----------------------------------------------------
              -- Table `${environment-schema}`.`shipment`
              -- -----------------------------------------------------
              DROP TABLE IF EXISTS `${environment-schema}`.`shipment` ;
              
              CREATE TABLE IF NOT EXISTS `${environment-schema}`.`shipment` (
              `shipment_id` INT NOT NULL AUTO_INCREMENT,
              `shipment_date` DATE NOT NULL,
              `shipment_tracking_number` VARCHAR(45) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `carrier_code` VARCHAR(10) NOT NULL,
              PRIMARY KEY (`shipment_id`),
              INDEX `fk_shipment_carrier1_idx` (`carrier_code` ASC) VISIBLE,
              CONSTRAINT `fk_shipment_carrier1`
              FOREIGN KEY (`carrier_code`)
              REFERENCES `${environment-schema}`.`carrier` (`carrier_code`)
              ON DELETE NO ACTION
              ON UPDATE NO ACTION)
              ENGINE = InnoDB;
              
              
              -- -----------------------------------------------------
              -- Table `${environment-schema}`.`transaction_type`
              -- -----------------------------------------------------
              DROP TABLE IF EXISTS `${environment-schema}`.`transaction_type` ;
              
              CREATE TABLE IF NOT EXISTS `${environment-schema}`.`transaction_type` (
              `transaction_type_code` VARCHAR(5) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `transaction_type_description` VARCHAR(50) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `conversion_factor` INT NULL DEFAULT NULL,
              PRIMARY KEY (`transaction_type_code`))
              ENGINE = InnoDB;
              
              
              -- -----------------------------------------------------
              -- Table `${environment-schema}`.`transaction_item`
              -- -----------------------------------------------------
              DROP TABLE IF EXISTS `${environment-schema}`.`transaction_item` ;
              
              CREATE TABLE IF NOT EXISTS `${environment-schema}`.`transaction_item` (
              `transaction_item_id` INT NOT NULL AUTO_INCREMENT,
              `transaction_id` INT NOT NULL,
              `item_inventory_id` INT NOT NULL,
              `transaction_type_code` VARCHAR(5) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `notes` TEXT COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              PRIMARY KEY (`transaction_item_id`),
              INDEX `fk_transaction_item_transactions1_idx` (`transaction_id` ASC) VISIBLE,
              INDEX `fk_transaction_item_transaction_type1_idx` (`transaction_type_code` ASC) VISIBLE,
              INDEX `fk_transaction_item_item_inventory1_idx` (`item_inventory_id` ASC) VISIBLE,
              CONSTRAINT `fk_transaction_item_transaction_type1`
              FOREIGN KEY (`transaction_type_code`)
              REFERENCES `${environment-schema}`.`transaction_type` (`transaction_type_code`)
              ON DELETE NO ACTION
              ON UPDATE NO ACTION,
              CONSTRAINT `fk_transaction_item_transactions1`
              FOREIGN KEY (`transaction_id`)
              REFERENCES `${environment-schema}`.`transactions` (`transaction_id`)
              ON DELETE NO ACTION
              ON UPDATE NO ACTION,
              CONSTRAINT `fk_transaction_item_item_inventory1`
              FOREIGN KEY (`item_inventory_id`)
              REFERENCES `${environment-schema}`.`item_inventory` (`item_inventory_id`)
              ON DELETE NO ACTION
              ON UPDATE NO ACTION)
              ENGINE = InnoDB
              AUTO_INCREMENT = 2107;
              
              
              -- -----------------------------------------------------
              -- Table `${environment-schema}`.`transaction_item_cost`
              -- -----------------------------------------------------
              DROP TABLE IF EXISTS `${environment-schema}`.`transaction_item_cost` ;
              
              CREATE TABLE IF NOT EXISTS `${environment-schema}`.`transaction_item_cost` (
              `transaction_item_cost_id` INT NOT NULL AUTO_INCREMENT,
              `transaction_item_id` INT NOT NULL,
              `cost_type_code` VARCHAR(10) NOT NULL,
              `currency_code` VARCHAR(5) NOT NULL,
              `amount` DECIMAL(12,4) NOT NULL,
              `notes` TEXT NULL,
              PRIMARY KEY (`transaction_item_cost_id`),
              INDEX `fk_transaction_cost_cost_type1_idx` (`cost_type_code` ASC) VISIBLE,
              INDEX `fk_transaction_item_cost_transaction_item1_idx` (`transaction_item_id` ASC) VISIBLE,
              CONSTRAINT `fk_transaction_cost_cost_type1`
              FOREIGN KEY (`cost_type_code`)
              REFERENCES `${environment-schema}`.`cost_type` (`cost_type_code`)
              ON DELETE NO ACTION
              ON UPDATE NO ACTION,
              CONSTRAINT `fk_transaction_item_cost_transaction_item1`
              FOREIGN KEY (`transaction_item_id`)
              REFERENCES `${environment-schema}`.`transaction_item` (`transaction_item_id`)
              ON DELETE NO ACTION
              ON UPDATE NO ACTION)
              ENGINE = InnoDB;
              
              
              -- -----------------------------------------------------
              -- Table `${environment-schema}`.`transaction_item_image`
              -- -----------------------------------------------------
              DROP TABLE IF EXISTS `${environment-schema}`.`transaction_item_image` ;
              
              CREATE TABLE IF NOT EXISTS `${environment-schema}`.`transaction_item_image` (
              `transaction_item_image_id` INT NOT NULL AUTO_INCREMENT,
              `transaction_item_image_type_code` VARCHAR(10) COLLATE 'utf8mb3_unicode_ci' NOT NULL,
              `transaction_item_image_url` VARCHAR(300) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `transaction_item_image_blob` VARCHAR(45) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL,
              `transaction_item_item_transaction_id` INT NOT NULL,
              PRIMARY KEY (`transaction_item_image_id`),
              INDEX `fk_transaction_item_image_transaction_item1_idx` (`transaction_item_item_transaction_id` ASC) VISIBLE,
              CONSTRAINT `fk_transaction_item_image_transaction_item1`
              FOREIGN KEY (`transaction_item_item_transaction_id`)
              REFERENCES `${environment-schema}`.`transaction_item` (`transaction_item_id`)
