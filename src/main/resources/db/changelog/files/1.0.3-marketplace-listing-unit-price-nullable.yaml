databaseChangeLog:
  - changeSet:
      id: 1.0.3-marketplace-listing-unit-price-nullable
      author: codex
      comment: Allow local marketplace drafts to wait for the Pricing Plane initial price.
      preConditions:
        - onFail: HALT
        - tableExists:
            tableName: marketplace_listing
        - columnExists:
            tableName: marketplace_listing
            columnName: unit_price
      changes:
        - sql:
            dbms: mysql
            sql: |
              ALTER TABLE `${environment-schema}`.`marketplace_listing`
                MODIFY COLUMN `unit_price` DECIMAL(9,2) NULL DEFAULT NULL COMMENT 'Current listing unit price in the listing currency. Null while Pricing Plane calculates an initial price for a local draft.';
