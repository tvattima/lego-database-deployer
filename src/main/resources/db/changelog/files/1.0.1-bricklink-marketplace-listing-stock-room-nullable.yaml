databaseChangeLog:
  - changeSet:
      id: 1.0.1-bricklink-marketplace-listing-stock-room-nullable
      author: codex
      changes:
        - sql:
            dbms: 'mysql'
            sql: |
              ALTER TABLE `${environment-schema}`.`bricklink_marketplace_listing`
                MODIFY COLUMN `stock_room_id` VARCHAR(1) COLLATE 'utf8mb3_unicode_ci' NULL DEFAULT NULL COMMENT 'BrickLink stock room identifier, when the listing is assigned to a stock room.';
