spring:
  liquibase:
    parameters:
      environment-schema: lego_sandbox

target-database:
  datasource:
    database-key-name: rasppi5-01-lego-sandbox
    hikari:
      connection-timeout: 2345
      idle-timeout: 3456
      connection-test-query: SELECT 1
      initialization-fail-timeout: 10000
      auto-commit: false
      login-timeout: 10000
      minimum-idle: 5
      maximum-pool-size: 5
      validation-timeout: 300000
      pool-name: rasppi5-01-lego-sandbox-jdbc-pool

